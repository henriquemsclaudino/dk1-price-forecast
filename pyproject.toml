[project]
name = "dk1-price-forecast"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Henrique Claudino", email = "henriquemsimaoc@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "holidays>=0.107",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "pyarrow>=26.0.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
    "streamlit>=1.66.1",
]

[project.scripts]
dk1-price-forecast = "dk1_price_forecast:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
